      cursor: pointer;
      font-size: 14px;

    }
    button.active {
      background-color: #007bff;
      color: white;
    }

      background-color: #e0e0e0;
      color: #333;
    }

      background-color: #d0d0d0;

      transform: scale(0.98);
    }
    button.region-btn.active {
      background-color: #28a745;
    }

      max-width: 820px;
      margin: 0 auto;
      background: white;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      min-height: 400px;
    }
    .period-card {
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.3s, transform 0.3s;
      display: none;
    }
    .period-card.visible {
      opacity: 1;
      transform: translateY(0);
      display: block;
    }
    .period-title {
      font-size: 22px;
      margin-bottom: 16px;
      color: #2c3e50;
      border-bottom: 2px solid #eee;
      padding-bottom: 8px;
    }

      display: flex;
      align-items: flex-start;
      margin-bottom: 14px;
      border-left: 4px solid #007bff;
      padding-left: 12px;
    }
    .event-date {
      min-width: 110px;
      font-weight: bold;
      color: #0056b3;
      margin-right: 12px;
      line-height: 1.4;
    }
    .event-desc {
      line-height: 1.5;
      color: #444;
      margin: 0;
    }
    .note {
      font-size: 13px;
      color: #777;
      margin-top: 18px;
      border-top: 1px solid #eee;
      padding-top: 12px;
    }
    .empty {

      color: #888;
      padding: 40px 0;

    // === ЛОГИКА ===
    const regionButtons = document.querySelectorAll('.region-btn');
    const periodButtons = document.querySelectorAll('.period-btn');
    const contentArea = document.getElementById('content-area');

    let currentRegion = 'world';
    let currentPeriod = 'ancient';

    function render() {
      // Подсветка кнопок
      regionButtons.forEach(b => b.classList.toggle('active', b.dataset.region === currentRegion));
      periodButtons.forEach(b => b.classList.toggle('active', b.dataset.period === currentPeriod));

      // Данные для текущей комбинации
      const block = data[currentRegion] && data[currentRegion][currentPeriod];

      if (!block) {
        contentArea.innerHTML = '<p class="empty">Для этого региона и периода пока нет данных.</p>';
        return;
      }

      // Формирование HTML
      const eventsHtml = block.events.map(([date, desc]) => `
        <div class="event-row">
          <span class="event-date">${date}</span>
          <p class="event-desc">${desc}</p>
        </div>
      `).join('');

      contentArea.innerHTML = `
        <div class="period-card visible">
          <div class="period-title">${block.title}</div>
          ${eventsHtml}
          <p class="note">${block.note}</p>
        </div>
      `;
    }

    regionButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        currentRegion = btn.dataset.region;
        render();
      });
    });

    periodButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        currentPeriod = btn.dataset.period;
        render();
      });
    });

    // Первичная отрисовка
    render();
  </script>
